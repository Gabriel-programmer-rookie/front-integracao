<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Supermercado Asteroide</title>
    <link rel="stylesheet" href="style.css">
    <script src="produtos.js" defer></script>

</head>
<body>
    <header>
        <div class="header-container">
            <img src="assets/logo.jpg" alt="Logo do Supermercado" class="logo">
            <h1>Supermercado Asteroide</h1>
        </div>
    </header>

    <main>
         <div id="loading" style="display: none; text-align: center; padding: 20px; color: #004aad; font-weight: bold;">
        Carregando...
    </div>
        <h2>Adicionar Produto</h2>
        <form>
            <label for="nome">Nome do Produto:</label><br>
            <input type="text" id="nome" name="nome"><br><br>

            <label for="preco">Preço:</label><br>
            <input type="number" id="preco" name="preco" step="0.01"><br><br>

            <label for="estoque">Estoque:</label><br>
            <input type="number" id="estoque" name="estoque"><br><br>

            <button type="submit">Salvar</button>
        </form>

        <hr>

        <h2>Lista de Produtos</h2>
        <table cellpadding="5">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
               
            </tbody>
        </table>

        <hr>

        <div id="form-edicao" style="display:none;">
            <h2>Editar Produto</h2>
            <form>
                <label for="idEditar">ID do Produto:</label><br>
                <input type="text" id="idEditar" name="idEditar" readonly><br><br>

                <label for="nomeEditar">Nome do Produto:</label><br>
                <input type="text" id="nomeEditar" name="nomeEditar"><br><br>

                <label for="precoEditar">Preço:</label><br>
                <input type="number" id="precoEditar" name="precoEditar" step="0.01"><br><br>

                <label for="estoqueEditar">Estoque:</label><br>
                <input type="number" id="estoqueEditar" name="estoqueEditar"><br><br>

                <button type="submit">Atualizar</button>
                <button type="button" onclick="cancelarEdicao()">Cancelar</button>
            </form>
        </div>
    </main>
</body>
</html>
