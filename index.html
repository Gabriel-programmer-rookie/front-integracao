==HTML=============================================================================================

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Supermercado Asteroide</title>
    <link rel="stylesheet" href="style.css">

    <script>
        function editarProduto(id, nome, preco, estoque) {
            document.getElementById("form-edicao").style.display = "block";

            document.getElementById("idEditar").value = id;
            document.getElementById("nomeEditar").value = nome;
            document.getElementById("precoEditar").value = preco;
            document.getElementById("estoqueEditar").value = estoque;

            window.scrollTo(0, document.body.scrollHeight);
        }

        function cancelarEdicao() {
            document.getElementById("form-edicao").style.display = "none";
        }
    </script>
</head>
<body>
    <header>
        <div class="header-container">
            <img src="assets/whatsapp.png" alt="Logo do Supermercado" class="logo">
            <h1>Supermercado Asteroide</h1>
        </div>
    </header>

    <main>
        <h2>Adicionar Produto</h2>
        <form>
            <label for="nome">Nome do Produto:</label><br>
            <input type="text" id="nome" name="nome"><br><br>

            <label for="preco">Preço:</label><br>
            <input type="number" id="preco" name="preco" step="0.01"><br><br>

            <label for="estoque">Estoque:</label><br>
            <input type="number" id="estoque" name="estoque"><br><br>

            <button type="submit">Salvar</button>
        </form>

        <hr>

        <h2>Lista de Produtos</h2>
        <table cellpadding="5">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Exemplo</td>
                    <td>10.00</td>
                    <td>5</td>
                    <td>
                        <button type="button" onclick="editarProduto(1, 'Exemplo', 10.00, 5)">Editar</button>
                        <button>Excluir</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <hr>

        <div id="form-edicao" style="display:none;">
            <h2>Editar Produto</h2>
            <form>
                <label for="idEditar">ID do Produto:</label><br>
                <input type="text" id="idEditar" name="idEditar" readonly><br><br>

                <label for="nomeEditar">Nome do Produto:</label><br>
                <input type="text" id="nomeEditar" name="nomeEditar"><br><br>

                <label for="precoEditar">Preço:</label><br>
                <input type="number" id="precoEditar" name="precoEditar" step="0.01"><br><br>

                <label for="estoqueEditar">Estoque:</label><br>
                <input type="number" id="estoqueEditar" name="estoqueEditar"><br><br>

                <button type="submit">Atualizar</button>
                <button type="button" onclick="cancelarEdicao()">Cancelar</button>
            </form>
        </div>
    </main>
</body>
</html>
